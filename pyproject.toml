[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-oxidized-viewer"
version = "0.1.0"
description = "NetBox plugin for viewing Oxidized configuration backups with history, diff, and full-text search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Chemseddine Guir", email = "guir.chemseddine@gmail.com" },
]
keywords = [
    "netbox",
    "netbox-plugin",
    "oxidized",
    "network-automation",
    "configuration-backup",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "dulwich>=0.21",
]

[project.urls]
Homepage = "https://github.com/CG-Djazairi/netbox-oxidized-viewer"
Repository = "https://github.com/CG-Djazairi/netbox-oxidized-viewer"
Issues = "https://github.com/CG-Djazairi/netbox-oxidized-viewer/issues"

[tool.setuptools.packages.find]
include = ["netbox_oxidized_viewer*"]

[tool.setuptools.package-data]
netbox_oxidized_viewer = ["templates/**/*", "static/**/*"]
