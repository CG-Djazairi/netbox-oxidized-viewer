[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-oxidized-viewer"
version = "0.1.5"
description = "NetBox plugin for viewing Oxidized configuration backups with history, diff, and full-text search"
readme = "README.md"
# NetBox 4.3 supports Python 3.10-3.12 (4.5 requires 3.12); follow the oldest supported NetBox.
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Chemseddine Guir", email = "guir.chemseddine@gmail.com" },
]
keywords = [
    "netbox",
    "netbox-plugin",
    "oxidized",
    "network-automation",
    "configuration-backup",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    # Upper bound: dulwich is versioned aggressively (0.x allowed breaking minor
    # releases); cap at the next major so a container rebuild can't silently pull
    # an untested API. Tested against 0.21–1.1.
    "dulwich>=0.21,<2.0",
    # requests is used only for the optional Oxidized "sync now" trigger; it is
    # already a NetBox dependency, pinned loosely here for correctness.
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/CG-Djazairi/netbox-oxidized-viewer"
Repository = "https://github.com/CG-Djazairi/netbox-oxidized-viewer"
Issues = "https://github.com/CG-Djazairi/netbox-oxidized-viewer/issues"

[tool.setuptools.packages.find]
include = ["netbox_oxidized_viewer*"]
exclude = ["netbox_oxidized_viewer.tests*"]

[tool.setuptools.package-data]
netbox_oxidized_viewer = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (line length) is handled by the formatter; migrations are generated code.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
