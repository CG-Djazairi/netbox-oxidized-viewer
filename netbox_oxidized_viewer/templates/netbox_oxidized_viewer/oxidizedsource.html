{% extends 'generic/object.html' %}

{% block content %}
<div class="row">
    <div class="col col-md-6">
        <div class="card">
            <h5 class="card-header">Oxidized Source</h5>
            <div class="card-body">
                <table class="table table-hover attr-table">
                    <tr>
                        <th scope="row">Name</th>
                        <td>{{ object.name }}</td>
                    </tr>
                    <tr>
                        <th scope="row">Git Repo Path</th>
                        <td>{{ object.git_repo_path }}</td>
                    </tr>
                    <tr>
                        <th scope="row">Node Name Source</th>
                        <td><code>{{ object.node_name_source }}</code></td>
                    </tr>
                </table>
            </div>
        </div>
        {% include 'inc/panels/tags.html' %}
    </div>
</div>
{% endblock content %}
