name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: twine check
        run: twine check dist/*

  test:
    runs-on: ubuntu-latest
    # NetBox 4.5 requires Python >= 3.12.
    strategy:
      matrix:
        netbox-version: ["v4.5.0"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone NetBox ${{ matrix.netbox-version }}
        run: git clone --depth 1 --branch ${{ matrix.netbox-version }} https://github.com/netbox-community/netbox.git

      - name: Install NetBox and the plugin
        run: |
          python -m pip install --upgrade pip
          pip install -r netbox/requirements.txt
          pip install ./plugin

      - name: Configure NetBox
        run: |
          cp netbox/netbox/netbox/configuration_testing.py netbox/netbox/netbox/configuration.py
          # Enable the plugin
          printf "\nPLUGINS = ['netbox_oxidized_viewer']\nPLUGINS_CONFIG = {'netbox_oxidized_viewer': {}}\n" \
            >> netbox/netbox/netbox/configuration.py
        env:
          DB_HOST: localhost
          REDIS_HOST: localhost

      - name: Run migrations and tests
        working-directory: netbox/netbox
        env:
          DB_HOST: localhost
          DB_NAME: netbox
          DB_USER: netbox
          DB_PASSWORD: netbox
          REDIS_HOST: localhost
        run: |
          python manage.py migrate
          python manage.py test netbox_oxidized_viewer -v2
