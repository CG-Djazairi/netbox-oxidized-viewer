name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build
# the sdist + wheel, publish them to PyPI, and attach them to a GitHub Release.
#
# One-time setup on PyPI (no API token needed — uses OIDC "Trusted Publishing"):
#   pypi.org -> Your projects -> Publishing -> add a pending publisher:
#     Owner: CG-Djazairi   Repo: netbox-oxidized-viewer
#     Workflow: release.yml   Environment: pypi
# (Create a GitHub environment named "pypi" too, or delete the `environment:`
#  line below to publish without one.)

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create or update the GitHub Release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
          || gh release upload "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" --clobber
