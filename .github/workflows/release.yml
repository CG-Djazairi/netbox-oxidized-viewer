name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build
# the sdist + wheel, publish them to PyPI, and attach them to a GitHub Release.
#
# One-time setup on PyPI (no API token needed — uses OIDC "Trusted Publishing"):
#   pypi.org -> Your projects -> Publishing -> add a pending publisher:
#     Owner: CG-Djazairi   Repo: netbox-oxidized-viewer
#     Workflow: release.yml   Environment: pypi
# (Create a GitHub environment named "pypi" too, or delete the `environment:`
#  line below to publish without one.)

on:
  push:
    tags: ['v*']

jobs:
  # Lint, build check and the full test matrix on the tagged commit itself:
  # a tag whose tests fail is not published.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tree = ast.parse(pathlib.Path('netbox_oxidized_viewer/__init__.py').read_text())
          plugin_class = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'OxidizedViewerConfig')
          plugin_version = next(ast.literal_eval(n.value) for n in plugin_class.body
                                if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'version' for t in n.targets))
          if os.environ['RELEASE_TAG'] != f'v{version}' or plugin_version != version:
              raise SystemExit('Release tag, package version, and PluginConfig.version must agree')
          PY
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create or update the GitHub Release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
          || gh release upload "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" --clobber
